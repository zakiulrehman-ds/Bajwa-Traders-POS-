{% extends 'core/base.html' %}

{% block page_title %}Profile{% endblock %}

{% block content %}
<form method="post" class="panel form-panel">
  {% csrf_token %}
  <input type="hidden" name="action" value="update_info">
  <h3>Profile details</h3>
  <p class="muted">Update your login username, display name, and email address.</p>

  <div class="form-grid">
    <div class="form-field">
      <label>Username</label>
      <input type="text" name="username" value="{{ request.user.username }}" required autocomplete="off">
    </div>
    <div class="form-field">
      <label>Email address</label>
      <input type="email" name="email" value="{{ request.user.email }}" placeholder="owner@bajwatraders.com" autocomplete="off">
    </div>
    <div class="form-field">
      <label>First name</label>
      <input type="text" name="first_name" value="{{ request.user.first_name }}" placeholder="Ali" autocomplete="off">
    </div>
    <div class="form-field">
      <label>Last name</label>
      <input type="text" name="last_name" value="{{ request.user.last_name }}" placeholder="Hassan" autocomplete="off">
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn primary">Save profile</button>
  </div>
</form>

<form method="post" class="panel form-panel" style="margin-top: 1rem;">
  {% csrf_token %}
  <input type="hidden" name="action" value="change_password">
  <h3>Change password</h3>
  <p class="muted">Enter your current password to set a new login password.</p>

  <div class="form-grid">
    <div class="form-field" x-data="{ show: false }">
      <label>Current password</label>
      <div class="flex items-center gap-2">
        <input :type="show ? 'text' : 'password'" name="current_password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" @click="show = !show" class="text-xs font-semibold text-slate-500 hover:text-emerald-800 cursor-pointer shrink-0" x-text="show ? 'Hide' : 'Show'"></button>
      </div>
    </div>

    <div class="form-field" x-data="{ show: false }">
      <label>New password</label>
      <div class="flex items-center gap-2">
        <input :type="show ? 'text' : 'password'" name="new_password" required minlength="6" autocomplete="new-password">
        <button type="button" @click="show = !show" class="text-xs font-semibold text-slate-500 hover:text-emerald-800 cursor-pointer shrink-0" x-text="show ? 'Hide' : 'Show'"></button>
      </div>
    </div>

    <div class="form-field" x-data="{ show: false }">
      <label>Confirm new password</label>
      <div class="flex items-center gap-2">
        <input :type="show ? 'text' : 'password'" name="confirm_password" required minlength="6" autocomplete="new-password">
        <button type="button" @click="show = !show" class="text-xs font-semibold text-slate-500 hover:text-emerald-800 cursor-pointer shrink-0" x-text="show ? 'Hide' : 'Show'"></button>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn primary">Update password</button>
  </div>
</form>
{% endblock %}
