<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Bajwa Traders</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/core/app.css"></head><body class="login-body"><form method="post" class="login-card">{% csrf_token %}<div class="brand-mark big">BT</div><h1>Bajwa Traders</h1><p>Sign in to your shop workspace</p>{% if form.errors %}<div class="message error">Username or password is incorrect.</div>{% endif %}<label>Username</label>{{ form.username }}<label>Password</label>{{ form.password }}<button class="btn primary full">Sign in</button></form></body></html>
